# Tek komutla kurulum (repo kökünden):
#   cp deploy/.env.example deploy/.env   # değerleri doldur
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Caddy tek origin sunar: /api ve /ws → backend, gerisi → panel.
# SITE_ADDRESS bir alan adıysa (signage.ornek.com) TLS sertifikası otomatik alınır.
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - signage-data:/data

  panel:
    build:
      context: ..
      dockerfile: deploy/panel.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - panel

volumes:
  signage-data:
  caddy-data:
  caddy-config:
